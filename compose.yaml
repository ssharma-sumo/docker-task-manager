x-app-common: &app-common
  build:
    context: ./app
  restart: unless-stopped
  env_file:
    - .env
  depends_on:
    - mongo-db
  networks:
    - frontend
    - backend

services:
  mongo-db:
    image: mongo:noble
    container_name: mongo-db
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
    volumes:
      - mongo_data:/data/db
    networks:
      - backend

  app-1:
    <<: *app-common
    environment:
      APP_NAME: app-1

  app-2:
    <<: *app-common
    environment:
      APP_NAME: app-2

  app-3:
    <<: *app-common
    environment:
      APP_NAME: app-3

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app-1
      - app-2
      - app-3
    networks:
      - frontend

networks:
  frontend:
  backend:

volumes:
  mongo_data:
